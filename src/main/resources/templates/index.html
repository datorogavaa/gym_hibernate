<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding-top: 100px;
        }
        .dashboard-card {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
            width: 100%;
        }
        h2 { color: #333; }
        p { color: #666; margin-bottom: 25px; }
        .username-highlight { color: #3498db; font-weight: bold; }
        .logout-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h2>Welcome to the Gym Dashboard!</h2>

    <!-- Dynamically display the logged-in username -->
    <p>Logged in as: <span class="username-highlight" th:text="${username}">User</span></p>

    <!-- Logout Form -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">Log Out</button>
    </form>
</div>

</body>
</html>
