spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always



# JWT for your own users (unchanged)
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration=PT1H

# ---- Microservices ----
spring.application.name=gym-crm-main

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Feign + circuit breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.timelimiter.configs.default.timeout-duration=4s

# JWT for service-to-service calls (value must equal security.jwt.secret in trainer-workload-service)
security.jwt.secret_integration=${WORKLOAD_JWT_SECRET:Z3ltLWNybS13b3JrbG9hZC1zZWNyZXQta2V5LW1pbi0yNTYtYml0cy1sb25nLSEhIQ==}
security.jwt.expiration-ms_integration=300000


logging.level.org.springframework.security=DEBUG


# transactionId in every log line
logging.pattern.level=%5p [txId=%X{transactionId:-none}]