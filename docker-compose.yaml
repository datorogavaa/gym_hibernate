services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_crm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym-crm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gym_crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: ./discovery-server
      dockerfile: Dockerfile
    image: gym-discovery-server:1.0
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    networks:
      - gym-crm-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  trainer-workload:
    build:
      context: ./trainer-workload-service
      dockerfile: Dockerfile
    image: trainer-workload-service:1.0
    container_name: trainer-workload
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: trainer-workload
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 5
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 5
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 15
      WORKLOAD_JWT_SECRET: ${WORKLOAD_JWT_SECRET}
    networks:
      - gym-crm-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  main-service-prod:
    build:
      context: ${GYM_CRM_CONTEXT}
      dockerfile: Dockerfile
    image: gym-main-service:1.0
    container_name: main-service-prod
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/gym_crm_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: main-service-prod
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 5
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 5
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 15
      JWT_SECRET: ${JWT_SECRET}
      WORKLOAD_JWT_SECRET: ${WORKLOAD_JWT_SECRET}
    networks:
      - gym-crm-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  gym-crm-net:
    driver: bridge

volumes:
  postgres_data: